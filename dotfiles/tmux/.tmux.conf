# Dracula colours, hand-rolled instead of pulling in TPM + dracula/tmux.
# Palette: https://draculatheme.com/contribute

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left "#[bg=#bd93f9,fg=#282a36,bold] #S #[default] "
set -g status-right "#[fg=#6272a4]%Y-%m-%d #[fg=#8be9fd]%H:%M "
set -g status-left-length 30

setw -g window-status-format "#[fg=#6272a4] #I:#W "
setw -g window-status-current-format "#[bg=#44475a,fg=#50fa7b,bold] #I:#W "

set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g mode-style "bg=#44475a,fg=#f1fa8c"
